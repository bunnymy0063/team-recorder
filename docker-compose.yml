version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: team-recorder-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: team-recorder
    volumes:
      - mongodb_data:/data/db

  backend:
    build: .
    container_name: team-recorder-api
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/team-recorder?authSource=admin
      JWT_SECRET: dev-secret-key-change-in-production
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      PORT: 5000
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongodb_data:
